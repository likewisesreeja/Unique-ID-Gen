services:

  generator-1:
    build: ./backend
    container_name: id-generator-1
    environment:
      MACHINE_ID: 1
      DATACENTER_ID: 1
    ports:
      - "8081:8080"

  generator-2:
    build: ./backend
    container_name: id-generator-2
    environment:
      MACHINE_ID: 2
      DATACENTER_ID: 1
    ports:
      - "8082:8080"

  generator-3:
    build: ./backend
    container_name: id-generator-3
    environment:
      MACHINE_ID: 3
      DATACENTER_ID: 1
    ports:
      - "8083:8080"

  nginx:
    image: nginx:alpine
    container_name: id-generator-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - generator-1
      - generator-2
      - generator-3

  frontend:
    build: ./frontend
    container_name: id-generator-frontend
    ports:
      - "5173:80"
    depends_on:
      - nginx

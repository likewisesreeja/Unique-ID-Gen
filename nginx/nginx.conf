events {
    worker_connections 1024;
}

http {
    upstream id_backend {
        # Round-robin across worker nodes. If a node is down, NGINX marks it
        # unavailable after 2 failed attempts and stops routing to it, which
        # is what the "kill a server, system keeps working" demo relies on.
        server generator-1:8080 max_fails=2 fail_timeout=5s;
        server generator-2:8080 max_fails=2 fail_timeout=5s;
        server generator-3:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://id_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
